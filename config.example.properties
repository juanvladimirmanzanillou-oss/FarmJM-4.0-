# ============================================================================
# FarmJM 2.0 - Configuración de la base de datos
# Copie este archivo como "config.properties" (junto al .jar o en la raíz del
# proyecto) y complete los datos. config.properties NO se sube a GitHub.
# También puede usar variables de entorno: FARMJM_DB_URL, FARMJM_DB_USER, FARMJM_DB_PASSWORD
# ============================================================================

# --- Opción A: MySQL local (MySQL Workbench) ---
db.url=jdbc:mysql://localhost:3306/farmjm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santo_Domingo
db.user=farmjm_user
db.password=CAMBIAR_POR_SU_CLAVE

# --- Opción B: MySQL en la nube (MyASP.NET) ---
# Use el servidor, la base, el usuario y la clave que muestra el panel de MyASP.NET:
# db.url=jdbc:mysql://SERVIDOR:3306/BASE?useSSL=true&serverTimezone=America/Santo_Domingo
# db.user=USUARIO_DEL_PANEL
# db.password=CLAVE_DEL_PANEL

# Pool de conexiones (HikariCP)
db.pool.size=5
db.timeout.ms=10000

# Carpeta del archivo de log de errores
log.dir=logs
